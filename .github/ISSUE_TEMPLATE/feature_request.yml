name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need or pain point, not just the solution.
      placeholder: I regularly analyze RFPs and there's no view that summarizes obligations…
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would you like to happen?
      description: The outcome or behavior you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project stays fully local by design. Please confirm your idea fits.
      options:
        - label: This can work client-side with no required server or mandatory network call.
          required: false
