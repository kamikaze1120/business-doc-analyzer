<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Business Document Analyzer — AI Business Analyst Operating System</title>
  <desc id="desc">Animated night background with purple and gold nebulae. A stack of document pages is scanned by a light bar; extracted requirement and test chips glow and feed a small knowledge graph of linked nodes.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".66"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCloud">
      <stop stop-color="#ffe69b" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#f0ad38" stop-opacity=".2"/>
      <stop offset="1" stop-color="#b76f08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#f4bb4d"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#af75ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#4fe3a6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0d1640"/>
      <stop offset="1" stop-color="#070b26"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4fe3a6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4fe3a6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4fe3a6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="34"/></clipPath>
    <clipPath id="pageClip"><rect x="0" y="0" width="170" height="220" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="270" cy="140" rx="340" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="310;380;310" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="250" rx="320" ry="200" fill="url(#goldCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="175;235;175" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <!-- Document stack being scanned -->
    <g transform="translate(756 96)" filter="url(#shadow)">
      <rect x="22" y="-16" width="170" height="220" rx="12" fill="#0a0f30" stroke="#9f62ff" stroke-opacity=".35" transform="rotate(5 107 94)"/>
      <rect x="11" y="-8" width="170" height="220" rx="12" fill="#0b1236" stroke="#d38cff" stroke-opacity=".35" transform="rotate(2.5 96 102)"/>
      <g>
        <rect width="170" height="220" rx="12" fill="url(#page)" stroke="url(#gold)" stroke-opacity=".8"/>
        <text x="16" y="28" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.6">BRD · v1.2</text>
        <rect x="16" y="42" width="112" height="6" rx="3" fill="#f4bb4d" opacity=".55"/>
        <rect x="16" y="62" width="138" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="74" width="124" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="86" width="132" height="4" rx="2" fill="#4fe3a6" opacity=".65"/>
        <rect x="16" y="98" width="96" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="118" width="86" height="6" rx="3" fill="#f4bb4d" opacity=".45"/>
        <rect x="16" y="136" width="138" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="148" width="110" height="4" rx="2" fill="#4fe3a6" opacity=".65"/>
        <rect x="16" y="160" width="128" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="172" width="74" height="4" rx="2" fill="#d9c7f2" opacity=".35"/>
        <rect x="16" y="192" width="120" height="4" rx="2" fill="#d38cff" opacity=".55"/>
        <g clip-path="url(#pageClip)">
          <rect x="0" y="-40" width="170" height="40" fill="url(#scan)">
            <animate attributeName="y" values="-40;220;-40" dur="5s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- Extracted chips flowing to the graph -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1">
      <g transform="translate(948 108)">
        <rect width="78" height="26" rx="13" fill="#0b2a2a" fill-opacity=".85" stroke="#4fe3a6" stroke-opacity=".8"/>
        <text x="14" y="17" fill="#c9ffe8">FR-001</text>
        <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(962 152)">
        <rect width="84" height="26" rx="13" fill="#1d1732" fill-opacity=".85" stroke="#f3c454" stroke-opacity=".75"/>
        <text x="13" y="17" fill="#ffe7a2">NFR-004</text>
        <animate attributeName="opacity" values=".35;1;.35" dur="3s" begin="1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(948 196)">
        <rect width="78" height="26" rx="13" fill="#160f38" fill-opacity=".85" stroke="#d34cff" stroke-opacity=".75"/>
        <text x="15" y="17" fill="#f0d7ff">TC-012</text>
        <animate attributeName="opacity" values=".35;1;.35" dur="3s" begin="2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Knowledge graph -->
    <g transform="translate(1092 170)">
      <g stroke="#f4bb4d" stroke-opacity=".45" stroke-width="1.2">
        <line x1="0" y1="0" x2="-28" y2="-62"/>
        <line x1="0" y1="0" x2="44" y2="-40"/>
        <line x1="0" y1="0" x2="50" y2="34"/>
        <line x1="0" y1="0" x2="-20" y2="66"/>
        <line x1="-28" y1="-62" x2="44" y2="-40"/>
        <line x1="50" y1="34" x2="-20" y2="66"/>
      </g>
      <circle r="11" fill="#f4bb4d" filter="url(#glow)">
        <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-28" cy="-62" r="6" fill="#4fe3a6" filter="url(#glow)"/>
      <circle cx="44" cy="-40" r="6" fill="#d871ff" filter="url(#glow)"/>
      <circle cx="50" cy="34" r="6" fill="#4fe3a6" filter="url(#glow)"/>
      <circle cx="-20" cy="66" r="6" fill="#d871ff" filter="url(#glow)"/>
      <circle r="88" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 12" opacity=".5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="36s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="756" y="358" fill="#bba7e6" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.4">DOCUMENT → TRUTH MODEL → TRACEABLE ARTIFACTS</text>

    <!-- Identity panel -->
    <g filter="url(#shadow)">
      <rect x="56" y="52" width="660" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="68" y="64" width="636" height="292" rx="22" fill="url(#glass)" stroke="#d38cff" stroke-opacity=".25"/>
    </g>
    <path d="M96 102H318" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="96" cy="102" r="5" fill="#4fe3a6" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="107" fill="#f9d777" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3">AI BUSINESS ANALYST OPERATING SYSTEM</text>
    <text x="94" y="178" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="2">BUSINESS DOC</text>
    <text x="94" y="238" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="2">ANALYZER</text>
    <text x="98" y="278" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17">Requirements, tests and traceability — in your browser.</text>

    <g transform="translate(98 304)">
      <rect width="168" height="40" rx="20" fill="#0b2420" fill-opacity=".8" stroke="#4fe3a6" stroke-opacity=".7"/>
      <circle cx="21" cy="20" r="5" fill="#4fe3a6" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="36" y="25" fill="#c9ffe8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">100% LOCAL</text>
    </g>
    <g transform="translate(280 304)">
      <rect width="176" height="40" rx="20" fill="#1d1732" fill-opacity=".8" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="20" y="25" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">NO BUILD STEP</text>
    </g>
    <g transform="translate(470 304)">
      <rect width="192" height="40" rx="20" fill="#111331" fill-opacity=".8" stroke="#9f62ff" stroke-opacity=".66"/>
      <text x="20" y="25" fill="#dcc9ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">AI OPTIONAL</text>
    </g>

    <rect x="0" y="0" width="1200" height="420" rx="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="none" stroke="#c44fff" stroke-opacity=".16"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#f7cf68" opacity=".045"><animate attributeName="y" values="-45;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
